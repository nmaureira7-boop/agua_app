{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
  <h2 class="mb-4"><i class="fa-solid fa-pen"></i> Editar Ingreso</h2>

  <form method="post" action="{{ url_for('admin_actualizar_ingreso', ingreso_id=ingreso.ingreso_id) }}">
    <div class="mb-3">
      <label for="fecha" class="form-label">Fecha</label>
      <input type="date" class="form-control" id="fecha" name="fecha" value="{{ ingreso.fecha }}">
    </div>
    <div class="mb-3">
      <label for="lectura" class="form-label">Lectura (m³)</label>
      <input type="number" class="form-control" id="lectura" name="lectura" value="{{ ingreso.lectura }}">
    </div>
    <div class="mb-3">
      <label for="consumo" class="form-label">Consumo</label>
      <input type="number" class="form-control" id="consumo" name="consumo" value="{{ ingreso.consumo }}">
    </div>
    <div class="mb-3">
      <label for="monto" class="form-label">Monto</label>
      <input type="number" class="form-control" id="monto" name="monto" value="{{ ingreso.monto }}">
    </div>
    <div class="mb-3">
      <label for="estado" class="form-label">Estado</label>
      <select class="form-select" id="estado" name="estado">
        <option value="pendiente" {% if ingreso.estado == 'pendiente' %}selected{% endif %}>Pendiente</option>
        <option value="aprobado" {% if ingreso.estado == 'aprobado' %}selected{% endif %}>Aprobado</option>
        <option value="rechazado" {% if ingreso.estado == 'rechazado' %}selected{% endif %}>Rechazado</option>
      </select>
    </div>
    <button type="submit" class="btn btn-success"><i class="fa-solid fa-save"></i> Guardar cambios</button>
    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
{% endblock %}
