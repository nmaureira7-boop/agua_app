<div class="d-flex justify-content-center">
  <div class="card p-4 shadow-lg bg-white rounded animate__animated animate__fadeInDown" style="max-width: 400px; width: 100%;">
    <h2 class="text-center mb-4">Bienvenido!!</h2>
    <form method="post">
      <div class="mb-3">
        <label for="correo" class="form-label">Correo electrónico</label>
        <input type="email" name="correo" id="correo" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="contraseña" class="form-label">Contraseña</label>
        <input type="password" name="contraseña" id="contraseña" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Entrar</button>
    </form>
    <div class="text-center mt-3">
      <a href="/registro" class="text-decoration-none">¿No tienes cuenta? Regístrate</a>
    </div>
  </div>
</div>
