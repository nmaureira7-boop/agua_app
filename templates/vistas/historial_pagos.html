<div class="card bg-light mb-4">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h5 class="mb-0"><i class="fa-solid fa-clock-rotate-left"></i> Historial de pagos</h5>
    {% if pagos %}
    <form method="POST" action="/limpiar_historial_pagos" onsubmit="return confirm('¿Estás seguro de que deseas eliminar todo el historial de pagos?');">
      <button type="submit" class="btn btn-danger btn-sm">
        <i class="fa-solid fa-trash"></i> Limpiar historial
      </button>
    </form>
    {% endif %}
  </div>
  <div class="card-body">
    {% if pagos %}
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Consumo (m³)</th>
            <th>Monto (CLP)</th>
          </tr>
        </thead>
        <tbody>
          {% for pago in pagos %}
          <tr>
            <td>{{ pago[0] }}</td>
            <td>{{ pago[1] }}</td>
            <td>${{ pago[2] | round(0) }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    {% else %}
      <div class="alert alert-info mb-0">No has realizado pagos aún.</div>
    {% endif %}
  </div>
</div>
