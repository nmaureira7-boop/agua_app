<div class="d-flex justify-content-center">
  <div class="card p-4 shadow-lg bg-white rounded" style="max-width: 500px; width: 100%;">
    <h2 class="text-center mb-4">Editar ingreso</h2>

    <!-- Mensajes flash -->
    {% with mensajes = get_flashed_messages(with_categories=true) %}
      {% if mensajes %}
        {% for categoria, mensaje in mensajes %}
          <div class="alert alert-{{ categoria }} alert-dismissible fade show" role="alert">
            {{ mensaje }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <!-- Formulario con acción explícita -->
    <form method="POST" action="{{ url_for('editar_ingreso_manual', ingreso_id=ingreso[0]) }}" novalidate>
      <div class="mb-3">
        <label for="direccion" class="form-label">
          <i class="fa-solid fa-location-dot"></i> Dirección
        </label>
        <input type="text" class="form-control" name="direccion" id="direccion" value="{{ ingreso[1] }}" required>
      </div>

      <div class="mb-3">
        <label for="consumo" class="form-label">
          <i class="fa-solid fa-tint"></i> Consumo (m³)
        </label>
        <input type="number" step="0.01" class="form-control" name="consumo" id="consumo" value="{{ ingreso[2] }}" required>
      </div>

      <div class="mb-3">
        <label for="fecha" class="form-label">
          <i class="fa-solid fa-calendar-day"></i> Fecha de ingreso
        </label>
        <input type="date" class="form-control" name="fecha" id="fecha"
               value="{{ ingreso[3]|default('', true) }}" required>
      </div>

      <button type="submit" class="btn btn-success w-100">
        <i class="fa-solid fa-pen-to-square"></i> Guardar cambios
      </button>
    </form>
  </div>
</div>
